services:
  - type: web
    name: apex-mood-api
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: apex-mood-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: apex-mood-db
    plan: free
